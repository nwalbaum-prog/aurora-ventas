{% extends "base.html" %}
{% block title %}Mayoristas{% endblock %}
{% block page_title %}Mayoristas B2B{% endblock %}

{% block content %}
<div class="toolbar">
  <div style="display:flex;gap:8px">
    <a href="/mayoristas"          class="btn btn-primary  btn-sm may-tab">Dashboard</a>
    <a href="/mayoristas/clientes" class="btn btn-secondary btn-sm may-tab">Clientes</a>
    <a href="/mayoristas/pedidos"  class="btn btn-secondary btn-sm may-tab">Pedidos</a>
    <a href="/mayoristas/cobranza" class="btn btn-secondary btn-sm may-tab">Cobranza</a>
  </div>
  <div class="toolbar-right">
    <button id="btn-generar" class="btn btn-primary btn-sm" onclick="generarSemana()">
      <i class="bi bi-play-fill"></i> Generar semana
    </button>
  </div>
</div>

<div id="kpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px"></div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
  <div class="card">
    <div class="card-title">Martes <span id="lbl-martes" style="font-weight:400;font-size:.8rem;color:var(--muted)"></span></div>
    <div id="martes-list"></div>
  </div>
  <div class="card">
    <div class="card-title">Jueves <span id="lbl-jueves" style="font-weight:400;font-size:.8rem;color:var(--muted)"></span></div>
    <div id="jueves-list"></div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
function fmtP(n){return'$'+Math.round(n||0).toLocaleString('es-CL');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const ESTADOS = {sin_generar:'Sin generar', borrador:'Borrador', generado:'Generado', confirmado:'Confirmado'};

async function loadDashboard() {
  const d = await api('GET', '/api/mayoristas/resumen').catch(e => { toast(e.message,'error'); return null; });
  if (!d) return;

  document.getElementById('kpis').innerHTML = [
    {l:'Clientes',         v: d.clientes,                      i:'bi-shop'},
    {l:'Pedidos semana',   v: d.pedidos_activos,               i:'bi-cart3'},
    {l:'Ventas 4 semanas', v: fmtP(d.ventas_4s),              i:'bi-cash-stack'},
    {l:'Por cobrar',       v: fmtP(d.por_cobrar), danger: d.por_cobrar > 0, i:'bi-hourglass-split'},
  ].map(k=>`<div class="kpi-card">
    <div class="kpi-label"><i class="bi ${k.i}"></i> ${k.l}</div>
    <div class="kpi-value" style="${k.danger?'color:var(--danger)':''}">${k.v}</div>
  </div>`).join('');

  const btnG = document.getElementById('btn-generar');
  btnG.innerHTML = `<i class="bi bi-play-fill"></i> Generar semana &nbsp;<span style="font-size:.75rem;opacity:.7">${esc(d.semana)} · ${esc(ESTADOS[d.sem_estado]||d.sem_estado)}</span>`;

  // Semana fechas
  const sem = await api('GET', `/api/mayoristas/semana?semana=${d.semana}`).catch(()=>null);
  if (sem) {
    document.getElementById('lbl-martes').textContent = sem.fecha_martes || '';
    document.getElementById('lbl-jueves').textContent = sem.fecha_jueves || '';
  }

  function renderDia(items, id) {
    const el = document.getElementById(id);
    if (!items.length) { el.innerHTML = '<div class="empty" style="padding:20px 0">Sin pedidos activos</div>'; return; }
    el.innerHTML = items.map(c=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:.875rem;font-weight:600">${esc(c.cliente)}</span>
        <span style="font-size:.8rem;color:var(--muted)">${c.n_productos} prod · ${fmtP(c.total)}</span>
      </div>`).join('');
    const tot = items.reduce((s,c)=>s+c.total,0);
    el.innerHTML += `<div style="text-align:right;padding:8px 0;font-size:.85rem;font-weight:700">Total: ${fmtP(tot)}</div>`;
  }
  renderDia(d.martes, 'martes-list');
  renderDia(d.jueves,  'jueves-list');
}

async function generarSemana() {
  if (!confirm('Generar ventas para todos los pedidos activos de esta semana?')) return;
  const btn = document.getElementById('btn-generar');
  btn.disabled = true;
  try {
    const r = await api('POST', '/api/mayoristas/generar-semana');
    toast(`${r.generadas} ventas generadas (${r.omitidas} ya existian)`, 'success');
    loadDashboard();
  } catch(e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; }
}

loadDashboard();
</script>
{% endblock %}
