{% extends "base.html" %}
{% block title %}Inventario — Aurora Bakers{% endblock %}
{% block page_title %}Inventario{% endblock %}

{% block content %}
<style>
.bodega-tabs { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.25rem; }
.bodega-tab  {
  display:flex; align-items:center; gap:.5rem;
  padding:.5rem 1rem; border-radius:8px; cursor:pointer; font-size:.84rem; font-weight:600;
  border:1.5px solid var(--border); background:var(--surface); color:var(--muted);
  transition:all .15s;
}
.bodega-tab:hover  { border-color:var(--aurora); color:var(--aurora); }
.bodega-tab.active { background:var(--aurora); border-color:var(--aurora); color:#fff; }
.bodega-tab .count { font-size:.7rem; background:rgba(255,255,255,.25); border-radius:10px; padding:.05rem .4rem; }
.bodega-tab:not(.active) .count { background:var(--bg); color:var(--muted); }

.alerta-strip {
  background:#fef3c7; border:1px solid #f59e0b; border-radius:8px;
  padding:.6rem 1rem; font-size:.83rem; font-weight:600; color:#92400e;
  display:flex; align-items:center; gap:.6rem; margin-bottom:1rem;
}
.alerta-strip.danger { background:#fee2e2; border-color:#ef4444; color:#991b1b; }
</style>

<!-- Toolbar -->
<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;flex-wrap:wrap">
  <div class="bodega-tabs" id="bodega-tabs">
    <div class="bodega-tab active" data-key="ingredientes"        onclick="setTab(this)"><i class="bi bi-moisture"></i> Ingredientes        <span class="count" id="cnt-ingredientes">0</span></div>
    <div class="bodega-tab"        data-key="productos_terminados" onclick="setTab(this)"><i class="bi bi-bag-check"></i> Prod. Terminados     <span class="count" id="cnt-productos_terminados">0</span></div>
    <div class="bodega-tab"        data-key="limpieza"             onclick="setTab(this)"><i class="bi bi-droplet"></i> Limpieza             <span class="count" id="cnt-limpieza">0</span></div>
    <div class="bodega-tab"        data-key="produccion"           onclick="setTab(this)"><i class="bi bi-tools"></i> Insumos Producción    <span class="count" id="cnt-produccion">0</span></div>
  </div>
  <button class="btn btn-primary" style="margin-left:auto" onclick="abrirNuevo()">
    <i class="bi bi-plus-lg"></i> Agregar
  </button>
</div>

<!-- Alertas -->
<div id="alerta-strip" style="display:none"></div>

<!-- Tabla -->
<div class="card">
  <div style="display:flex;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap" id="cat-filter-bar">
    <select id="f-cat-filter" class="form-control" style="width:160px" onchange="filtrarPorCategoria()">
      <option value="">Todas las categorías</option>
    </select>
    <select id="f-subcat-filter" class="form-control" style="width:160px" onchange="filtrarPorCategoria()">
      <option value="">Todas las subcategorías</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead id="thead-inv"></thead>
      <tbody id="tbody-inv"></tbody>
    </table>
  </div>
</div>

<!-- Modal nuevo/editar -->
<div id="modal-inv" class="modal-overlay">
  <div class="modal" style="max-width:500px">
    <div class="modal-header">
      <span class="modal-title" id="modal-inv-title">Nuevo ítem</span>
      <button class="modal-close" onclick="closeModal('modal-inv')"><i class="bi bi-x-lg"></i></button>
    </div>
    <input type="hidden" id="f-id">
    <div style="display:grid;gap:.75rem">
      <div class="form-row fr-2">
        <div class="form-group">
          <label>Nombre *</label>
          <input id="f-nombre" class="form-control" placeholder="Ej: Harina blanca">
        </div>
        <div class="form-group">
          <label>Bodega</label>
          <select id="f-bodega" class="form-control" onchange="onBodegaChange()">
            <option value="ingredientes">Ingredientes</option>
            <option value="productos_terminados">Prod. Terminados</option>
            <option value="limpieza">Limpieza</option>
            <option value="produccion">Insumos Producción</option>
          </select>
        </div>
      </div>
      <div class="form-row fr-3">
        <div class="form-group">
          <label>Stock actual</label>
          <input id="f-stock" type="number" step="0.01" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>Alerta mínimo</label>
          <input id="f-alerta" type="number" step="0.01" class="form-control" placeholder="1">
        </div>
        <div class="form-group">
          <label>Unidad</label>
          <select id="f-unidad" class="form-control">
            <option value="kg">kg</option>
            <option value="g">gramos</option>
            <option value="litros">litros</option>
            <option value="ml">ml</option>
            <option value="unidades">unidades</option>
            <option value="cajas">cajas</option>
            <option value="bolsas">bolsas</option>
            <option value="rollos">rollos</option>
          </select>
        </div>
      </div>
      <div class="form-row fr-2">
        <div class="form-group">
          <label>Proveedor</label>
          <input id="f-proveedor" class="form-control" placeholder="Opcional">
        </div>
        <div class="form-group">
          <label id="precio-label">Precio / unidad (CLP)</label>
          <input id="f-precio" type="number" class="form-control" placeholder="0">
        </div>
      </div>
      <div class="form-row fr-2">
        <div class="form-group">
          <label class="label">Categoría</label>
          <input id="f-categoria" type="text" class="form-control" list="dl-categorias"
                 placeholder="Ej: Harina, Grasa, Levadura…" style="width:100%"
                 oninput="filtrarSubcategorias()">
          <datalist id="dl-categorias"></datalist>
        </div>
        <div class="form-group">
          <label class="label">Subcategoría</label>
          <input id="f-subcategoria" type="text" class="form-control" list="dl-subcategorias"
                 placeholder="Ej: Blanca, Integral…" style="width:100%">
          <datalist id="dl-subcategorias"></datalist>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-inv')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()"><i class="bi bi-check-lg"></i> Guardar</button>
    </div>
  </div>
</div>

<!-- Modal ajustar stock -->
<div id="modal-ajuste" class="modal-overlay">
  <div class="modal" style="max-width:340px">
    <div class="modal-header">
      <span class="modal-title">Ajustar Stock</span>
      <button class="modal-close" onclick="closeModal('modal-ajuste')"><i class="bi bi-x-lg"></i></button>
    </div>
    <p id="ajuste-nombre" style="font-weight:600;color:var(--text);margin-bottom:.75rem"></p>
    <div class="form-group">
      <label>Delta (+ agregar / − descontar)</label>
      <div style="display:flex;gap:.5rem;align-items:center">
        <input id="f-delta" type="number" step="0.01" class="form-control" placeholder="ej: 5 ó -1.5" style="flex:1">
        <span id="ajuste-unidad" style="color:var(--muted);font-size:.85rem;white-space:nowrap"></span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-ajuste')">Cancelar</button>
      <button class="btn btn-primary" onclick="ajustar()">Aplicar</button>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const BODEGAS = {
  ingredientes:        { label: 'Ingredientes',          icon: 'bi-moisture',  unidad_default: 'kg'       },
  productos_terminados:{ label: 'Prod. Terminados',      icon: 'bi-bag-check', unidad_default: 'unidades' },
  limpieza:            { label: 'Insumos de Limpieza',   icon: 'bi-droplet',   unidad_default: 'unidades' },
  produccion:          { label: 'Insumos de Producción', icon: 'bi-tools',     unidad_default: 'unidades' },
};

let todosItems = [];
let tabActual  = 'ingredientes';
let editId     = null;
let ajusteId   = null;

let categoriasData = { categorias: [], subcategorias: {} };

async function cargarCategorias() {
  categoriasData = await api('GET', '/api/inventario/categorias');
  // Poblar datalist del modal
  document.getElementById('dl-categorias').innerHTML =
    categoriasData.categorias.map(c => `<option value="${c}">`).join('');
  // Poblar select de filtro
  const sel = document.getElementById('f-cat-filter');
  sel.innerHTML = '<option value="">Todas las categorías</option>' +
    categoriasData.categorias.map(c => `<option value="${c}">${c}</option>`).join('');
}

function filtrarSubcategorias() {
  const cat = document.getElementById('f-categoria').value;
  const subs = categoriasData.subcategorias[cat] || [];
  document.getElementById('dl-subcategorias').innerHTML =
    subs.map(s => `<option value="${s}">`).join('');
}

function filtrarPorCategoria() {
  const cat    = document.getElementById('f-cat-filter').value;
  const subcat = document.getElementById('f-subcat-filter').value;
  // Actualizar subcategorías disponibles en el segundo select
  const subs = cat ? (categoriasData.subcategorias[cat] || []) : [];
  const selSub = document.getElementById('f-subcat-filter');
  selSub.innerHTML = '<option value="">Todas las subcategorías</option>' +
    subs.map(s => `<option value="${s}">${s}</option>`).join('');
  // Filtrar items mostrados
  renderTab(cat, selSub.value);
}

async function load() {
  todosItems = await api('GET', '/api/inventario');
  await cargarCategorias();

  // Contadores por tab
  Object.keys(BODEGAS).forEach(key => {
    const cnt = document.getElementById('cnt-' + key);
    if (cnt) cnt.textContent = todosItems.filter(i => i.bodega === key).length;
  });

  renderTab();
}

function setTab(el) {
  document.querySelectorAll('.bodega-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  tabActual = el.dataset.key;
  renderTab();
}

function renderTab(cat, subcat) {
  cat    = cat    !== undefined ? cat    : (document.getElementById('f-cat-filter')?.value    || '');
  subcat = subcat !== undefined ? subcat : (document.getElementById('f-subcat-filter')?.value || '');
  let items = todosItems.filter(i => i.bodega === tabActual);
  if (cat)    items = items.filter(i => i.categoria    === cat);
  if (subcat) items = items.filter(i => i.subcategoria === subcat);
  const alertas = items.filter(i => i.stock_kg <= 0);
  const reponer = items.filter(i => i.stock_kg > 0 && i.stock_kg <= i.alerta_minimo_kg);

  // Alerta strip
  const strip = document.getElementById('alerta-strip');
  if (alertas.length > 0) {
    strip.style.display = '';
    strip.className = 'alerta-strip danger';
    strip.innerHTML = `<i class="bi bi-exclamation-octagon-fill"></i> ${alertas.length} ítem(s) sin stock: ${alertas.map(a => a.ingrediente).join(', ')}`;
  } else if (reponer.length > 0) {
    strip.style.display = '';
    strip.className = 'alerta-strip';
    strip.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i> ${reponer.length} ítem(s) para reponer: ${reponer.map(a => a.ingrediente).join(', ')}`;
  } else {
    strip.style.display = 'none';
  }

  // Cabecera
  document.getElementById('thead-inv').innerHTML = `<tr>
    <th>Ítem</th>
    <th>Categoría</th>
    <th class="right">Stock</th>
    <th class="right">Alerta mín.</th>
    <th>Estado</th>
    <th>Proveedor</th>
    <th class="right">Precio / u.</th>
    <th>Actualizado</th>
    <th></th>
  </tr>`;

  // Filas
  document.getElementById('tbody-inv').innerHTML = items.length
    ? items.map(i => {
        const u = i.unidad || 'kg';
        const badge = i.stock_kg <= 0
          ? '<span class="badge" style="background:#fee2e2;color:#991b1b">Sin stock</span>'
          : i.stock_kg <= i.alerta_minimo_kg
            ? '<span class="badge" style="background:#fef3c7;color:#92400e">Reponer</span>'
            : '<span class="badge" style="background:#dcfce7;color:#166534">OK</span>';
        const catLabel = i.categoria
          ? (i.subcategoria ? `${i.categoria} / ${i.subcategoria}` : i.categoria)
          : '<span style="color:var(--muted)">—</span>';
        return `<tr>
          <td class="fw-600">${i.ingrediente}</td>
          <td style="font-size:.8rem">${catLabel}</td>
          <td class="right mono">${i.stock_kg % 1 === 0 ? i.stock_kg : i.stock_kg.toFixed(2)} ${u}</td>
          <td class="right mono text-muted">${i.alerta_minimo_kg % 1 === 0 ? i.alerta_minimo_kg : i.alerta_minimo_kg.toFixed(2)} ${u}</td>
          <td>${badge}</td>
          <td class="text-muted text-sm">${i.proveedor || '—'}</td>
          <td class="right mono text-muted">${i.precio_kg > 0 ? '$' + Math.round(i.precio_kg).toLocaleString('es-CL') : '—'}</td>
          <td class="text-muted text-sm">${i.ultima_actualizacion || '—'}</td>
          <td>
            <div class="flex gap-8">
              <button class="btn btn-secondary btn-icon btn-sm" title="Ajustar stock"
                      onclick="abrirAjuste(${i.id},'${i.ingrediente}','${u}')">
                <i class="bi bi-plus-slash-minus"></i>
              </button>
              <button class="btn btn-secondary btn-icon btn-sm" title="Editar"
                      onclick='abrirEditar(${JSON.stringify(i).replace(/"/g,"&quot;")})'>
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-danger btn-icon btn-sm" title="Eliminar"
                      onclick="eliminar(${i.id})">
                <i class="bi bi-trash3"></i>
              </button>
            </div>
          </td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="9"><div class="empty"><i class="bi bi-inbox"></i><p>Sin ítems en esta bodega</p></div></td></tr>`;
}

function onBodegaChange() {
  const b = document.getElementById('f-bodega').value;
  const u = document.getElementById('f-unidad');
  u.value = BODEGAS[b]?.unidad_default || 'kg';
}

function abrirNuevo() {
  editId = null;
  document.getElementById('modal-inv-title').textContent = 'Nuevo ítem';
  document.getElementById('f-id').value = '';
  document.getElementById('f-nombre').value = '';
  document.getElementById('f-nombre').disabled = false;
  document.getElementById('f-bodega').value = tabActual;
  document.getElementById('f-unidad').value = BODEGAS[tabActual]?.unidad_default || 'kg';
  document.getElementById('f-stock').value = '';
  document.getElementById('f-alerta').value = '1';
  document.getElementById('f-proveedor').value = '';
  document.getElementById('f-precio').value = '';
  document.getElementById('f-categoria').value    = '';
  document.getElementById('f-subcategoria').value = '';
  openModal('modal-inv');
}

function abrirEditar(i) {
  editId = i.id;
  document.getElementById('modal-inv-title').textContent = 'Editar — ' + i.ingrediente;
  document.getElementById('f-id').value = i.id;
  document.getElementById('f-nombre').value = i.ingrediente;
  document.getElementById('f-nombre').disabled = false;
  document.getElementById('f-bodega').value = i.bodega || 'ingredientes';
  document.getElementById('f-unidad').value = i.unidad || 'kg';
  document.getElementById('f-stock').value = i.stock_kg;
  document.getElementById('f-alerta').value = i.alerta_minimo_kg;
  document.getElementById('f-proveedor').value = i.proveedor || '';
  document.getElementById('f-precio').value = i.precio_kg || 0;
  document.getElementById('f-categoria').value    = i.categoria    || '';
  document.getElementById('f-subcategoria').value = i.subcategoria || '';
  filtrarSubcategorias();
  openModal('modal-inv');
}

function abrirAjuste(id, nombre, unidad) {
  ajusteId = id;
  document.getElementById('ajuste-nombre').textContent = nombre;
  document.getElementById('ajuste-unidad').textContent = unidad;
  document.getElementById('f-delta').value = '';
  openModal('modal-ajuste');
}

async function guardar() {
  const nombre = document.getElementById('f-nombre').value.trim();
  if (!nombre) { toast('Ingresa el nombre', 'error'); return; }
  const body = {
    ingrediente:      nombre,
    bodega:           document.getElementById('f-bodega').value,
    unidad:           document.getElementById('f-unidad').value,
    stock_kg:         parseFloat(document.getElementById('f-stock').value) || 0,
    alerta_minimo_kg: parseFloat(document.getElementById('f-alerta').value) || 1,
    proveedor:        document.getElementById('f-proveedor').value.trim(),
    precio_kg:        parseFloat(document.getElementById('f-precio').value) || 0,
    categoria:        document.getElementById('f-categoria').value.trim(),
    subcategoria:     document.getElementById('f-subcategoria').value.trim(),
  };
  try {
    if (editId) await api('PUT', `/api/inventario/${editId}`, body);
    else        await api('POST', '/api/inventario', body);
    closeModal('modal-inv');
    await load();
    toast(editId ? 'Actualizado' : 'Ítem creado');
  } catch(e) { toast(e.message, 'error'); }
}

async function ajustar() {
  const delta = parseFloat(document.getElementById('f-delta').value) || 0;
  try {
    await api('POST', `/api/inventario/${ajusteId}/ajustar`, { delta });
    closeModal('modal-ajuste');
    await load();
    toast('Stock ajustado');
  } catch(e) { toast(e.message, 'error'); }
}

async function eliminar(id) {
  if (!confirm('¿Eliminar este ítem?')) return;
  try {
    await api('DELETE', `/api/inventario/${id}`);
    await load();
    toast('Eliminado');
  } catch(e) { toast(e.message, 'error'); }
}

load();
</script>
{% endblock %}
