{% extends "base.html" %}
{% block title %}Agenda — Aurora Bakers{% endblock %}
{% block page_title %}Agenda{% endblock %}
{% block content %}

<div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center">
  <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Nueva tarea / evento</button>
  <div style="margin-left:auto;display:flex;gap:.5rem">
    <button class="btn btn-ghost" id="btn-hoy" onclick="setFiltro('hoy')">Hoy</button>
    <button class="btn btn-ghost" id="btn-todos" onclick="setFiltro('todos')">Todos pendientes</button>
    <button class="btn btn-ghost" id="btn-completos" onclick="setFiltro('completos')">Completados</button>
  </div>
</div>

<div id="vencidos-alert" style="display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:1rem;color:#f87171;font-size:.85rem">
  <i class="bi bi-clock-history"></i> <span id="vencidos-count">0</span> tarea(s) vencida(s)
</div>

<div id="items-container" style="display:grid;gap:.5rem"></div>

<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal-box" style="max-width:460px">
    <div class="modal-header"><h3 id="modal-title">Nueva tarea</h3><button class="btn-icon" onclick="closeModal()"><i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body" style="display:grid;gap:.75rem">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        <div>
          <label class="label">Tipo</label>
          <select id="af-tipo" class="input">
            <option value="tarea">Tarea</option>
            <option value="evento">Evento</option>
            <option value="recordatorio">Recordatorio</option>
            <option value="llamada">Llamada</option>
          </select>
        </div>
        <div>
          <label class="label">Prioridad</label>
          <select id="af-prioridad" class="input">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
      </div>
      <div><label class="label">Título</label><input id="af-titulo" class="input" placeholder="Ej: Llamar al distribuidor de harina" /></div>
      <div><label class="label">Descripción</label><textarea id="af-desc" class="input" rows="2" placeholder="Detalles opcionales"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        <div><label class="label">Fecha</label><input id="af-fecha" type="date" class="input" /></div>
        <div><label class="label">Hora (opcional)</label><input id="af-hora" type="time" class="input" /></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script>
let editId = null, filtro = 'hoy';
const hoy = new Date().toISOString().split('T')[0];
document.getElementById('af-fecha').value = hoy;

const TIPO_ICON = {tarea:'bi-check2-square', evento:'bi-calendar-event', recordatorio:'bi-bell', llamada:'bi-telephone'};
const PRIOR_COLOR = {alta:'badge-red', media:'badge-yellow', baja:'badge-blue'};

function setFiltro(f) {
  filtro=f;
  ['hoy','todos','completos'].forEach(x => document.getElementById('btn-'+x).classList.toggle('btn-primary', x===f));
  ['hoy','todos','completos'].forEach(x => document.getElementById('btn-'+x).classList.toggle('btn-ghost', x!==f));
  load();
}

async function load() {
  let url = '/api/agenda';
  if (filtro === 'hoy') url += `?fecha=${hoy}`;
  else if (filtro === 'todos') url += '?pendientes=1';
  const res = await fetch(url);
  let items = await res.json();
  if (filtro === 'completos') items = items.filter(i => i.completado);
  else if (filtro !== 'hoy') items = items.filter(i => !i.completado);

  // Vencidos
  const vencidos = items.filter(i => i.fecha < hoy && !i.completado);
  document.getElementById('vencidos-alert').style.display = vencidos.length ? '' : 'none';
  document.getElementById('vencidos-count').textContent = vencidos.length;

  if (!items.length) {
    document.getElementById('items-container').innerHTML = `<div style="text-align:center;padding:3rem;color:var(--muted)"><i class="bi bi-calendar-check" style="font-size:2.5rem"></i><p style="margin-top:.75rem">${filtro==='hoy'?'Sin tareas para hoy':'Sin items'}</p></div>`;
    return;
  }

  document.getElementById('items-container').innerHTML = items.map(item => {
    const vencido = !item.completado && item.fecha < hoy;
    return `<div style="background:var(--bg-2);border-radius:var(--r);padding:.8rem 1rem;display:flex;gap:.75rem;align-items:flex-start;${vencido?'border-left:3px solid #ef4444':''}">
      <button class="btn-icon" style="margin-top:.1rem;${item.completado?'color:var(--accent)':''}" onclick="completar(${item.id})" title="${item.completado?'Completado':'Marcar como listo'}">
        <i class="bi ${item.completado?'bi-check-circle-fill':'bi-circle'}"></i>
      </button>
      <div style="flex:1">
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
          <span style="font-weight:600;color:var(--text);${item.completado?'text-decoration:line-through;opacity:.5':''}">${item.titulo}</span>
          <span class="badge ${PRIOR_COLOR[item.prioridad]||'badge-blue'}">${item.prioridad}</span>
          <span class="badge badge-blue"><i class="bi ${TIPO_ICON[item.tipo]||'bi-tag'}"></i> ${item.tipo}</span>
        </div>
        ${item.descripcion ? `<div style="font-size:.8rem;color:var(--muted);margin-top:.2rem">${item.descripcion}</div>` : ''}
        <div style="font-size:.75rem;color:${vencido?'#f87171':'var(--text-3)'};margin-top:.25rem">
          <i class="bi bi-calendar3"></i> ${item.fecha}${item.hora?' '+item.hora:''}
        </div>
      </div>
      <div style="display:flex;gap:.25rem">
        <button class="btn-icon" onclick='openEdit(${JSON.stringify(item).replace(/"/g,"&quot;")})' title="Editar"><i class="bi bi-pencil"></i></button>
        <button class="btn-icon text-danger" onclick="eliminar(${item.id})" title="Eliminar"><i class="bi bi-trash"></i></button>
      </div>
    </div>`;
  }).join('');
}

function openModal() { editId=null; document.getElementById('modal-title').textContent='Nueva tarea'; document.getElementById('af-titulo').value=''; document.getElementById('af-desc').value=''; document.getElementById('af-fecha').value=hoy; document.getElementById('af-hora').value=''; document.getElementById('af-tipo').value='tarea'; document.getElementById('af-prioridad').value='media'; document.getElementById('modal').style.display='flex'; }
function closeModal() { document.getElementById('modal').style.display='none'; }
function openEdit(item) { editId=item.id; document.getElementById('modal-title').textContent='Editar'; document.getElementById('af-titulo').value=item.titulo; document.getElementById('af-desc').value=item.descripcion||''; document.getElementById('af-fecha').value=item.fecha; document.getElementById('af-hora').value=item.hora||''; document.getElementById('af-tipo').value=item.tipo; document.getElementById('af-prioridad').value=item.prioridad; document.getElementById('modal').style.display='flex'; }

async function guardar() {
  const titulo = document.getElementById('af-titulo').value.trim();
  if(!titulo) return showToast('Escribe un título','error');
  const body = {tipo:document.getElementById('af-tipo').value, titulo, descripcion:document.getElementById('af-desc').value, fecha:document.getElementById('af-fecha').value, hora:document.getElementById('af-hora').value, prioridad:document.getElementById('af-prioridad').value};
  const url = editId ? `/api/agenda/${editId}` : '/api/agenda';
  await fetch(url, {method:editId?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  closeModal(); load(); showToast('Guardado','success');
}

async function completar(id) {
  await fetch(`/api/agenda/${id}/completar`, {method:'POST'});
  load();
}

async function eliminar(id) {
  if(!confirm('¿Eliminar?')) return;
  await fetch(`/api/agenda/${id}`, {method:'DELETE'});
  load(); showToast('Eliminado','success');
}

setFiltro('hoy');
</script>
{% endblock %}
