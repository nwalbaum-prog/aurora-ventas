{% extends "base.html" %}
{% block title %}Agenda — Aurora Bakers{% endblock %}
{% block page_title %}Agenda{% endblock %}
{% block content %}

<div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center">
  <button class="btn btn-primary" onclick="abrirNueva()"><i class="bi bi-plus-lg"></i> Nueva tarea / evento</button>
  <div style="margin-left:auto;display:flex;gap:.5rem">
    <button class="btn btn-ghost" id="btn-hoy"      onclick="setFiltro('hoy')">Hoy</button>
    <button class="btn btn-ghost" id="btn-todos"    onclick="setFiltro('todos')">Todos pendientes</button>
    <button class="btn btn-ghost" id="btn-completos" onclick="setFiltro('completos')">Completados</button>
  </div>
</div>

<div id="vencidos-alert" style="display:none;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:1rem;color:var(--danger);font-size:.85rem">
  <i class="bi bi-clock-history"></i> <span id="vencidos-count">0</span> tarea(s) vencida(s)
</div>

<div id="items-container" style="display:grid;gap:.5rem"></div>

<!-- Modal nueva/editar tarea -->
<div id="modal-agenda" class="modal-overlay">
  <div class="modal" style="max-width:460px">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Nueva tarea</span>
      <button class="modal-close" onclick="closeModal('modal-agenda')"><i class="bi bi-x-lg"></i></button>
    </div>
    <div style="display:grid;gap:.75rem">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        <div class="form-group">
          <label>Tipo</label>
          <select id="af-tipo">
            <option value="tarea">Tarea</option>
            <option value="evento">Evento</option>
            <option value="recordatorio">Recordatorio</option>
            <option value="llamada">Llamada</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prioridad</label>
          <select id="af-prioridad">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Título *</label>
        <input id="af-titulo" placeholder="Ej: Llamar al distribuidor de harina" />
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea id="af-desc" rows="2" placeholder="Detalles opcionales"></textarea>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        <div class="form-group"><label>Fecha</label><input id="af-fecha" type="date" /></div>
        <div class="form-group"><label>Hora (opcional)</label><input id="af-hora" type="time" /></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-agenda')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script>
let editId = null, filtro = 'hoy';
const hoy = new Date().toISOString().split('T')[0];
document.getElementById('af-fecha').value = hoy;

const TIPO_ICON  = { tarea:'bi-check2-square', evento:'bi-calendar-event', recordatorio:'bi-bell', llamada:'bi-telephone' };
const PRIOR_CLS  = { alta:'badge-red', media:'badge-yellow', baja:'badge-blue' };

function setFiltro(f) {
  filtro = f;
  ['hoy','todos','completos'].forEach(x => {
    const btn = document.getElementById('btn-'+x);
    btn.className = x===f ? 'btn btn-primary' : 'btn btn-ghost';
  });
  load();
}

async function load() {
  let url = '/api/agenda';
  if (filtro === 'hoy')   url += `?fecha=${hoy}`;
  else if (filtro === 'todos') url += '?pendientes=1';
  let items = await api('GET', url);
  if (filtro === 'completos') items = items.filter(i => i.completado);
  else if (filtro !== 'hoy')  items = items.filter(i => !i.completado);

  const vencidos = items.filter(i => i.fecha < hoy && !i.completado);
  document.getElementById('vencidos-alert').style.display = vencidos.length ? '' : 'none';
  document.getElementById('vencidos-count').textContent = vencidos.length;

  if (!items.length) {
    document.getElementById('items-container').innerHTML = `
      <div class="card"><div class="empty">
        <i class="bi bi-calendar-check"></i>
        <p>${filtro==='hoy' ? 'Sin tareas para hoy' : 'Sin items'}</p>
      </div></div>`;
    return;
  }

  document.getElementById('items-container').innerHTML = items.map(item => {
    const vencido = !item.completado && item.fecha < hoy;
    return `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1rem;display:flex;gap:.75rem;align-items:flex-start;${vencido?'border-left:3px solid var(--danger)':''}">
      <button style="background:none;border:none;cursor:pointer;color:${item.completado?'var(--accent)':'var(--muted)'};font-size:1.1rem;margin-top:.1rem;padding:0"
        onclick="completar(${item.id})" title="${item.completado?'Completado':'Marcar como listo'}">
        <i class="bi ${item.completado?'bi-check-circle-fill':'bi-circle'}"></i>
      </button>
      <div style="flex:1">
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
          <span style="font-weight:600;${item.completado?'text-decoration:line-through;opacity:.5':''}">${item.titulo}</span>
          <span class="badge ${PRIOR_CLS[item.prioridad]||'badge-blue'}">${item.prioridad}</span>
          <span class="badge badge-gray"><i class="bi ${TIPO_ICON[item.tipo]||'bi-tag'}"></i> ${item.tipo}</span>
        </div>
        ${item.descripcion ? `<div style="font-size:.8rem;color:var(--muted);margin-top:.25rem">${item.descripcion}</div>` : ''}
        <div style="font-size:.75rem;color:${vencido?'var(--danger)':'var(--muted)'};margin-top:.25rem">
          <i class="bi bi-calendar3"></i> ${item.fecha}${item.hora ? ' ' + item.hora : ''}
        </div>
      </div>
      <div style="display:flex;gap:.25rem">
        <button class="btn btn-secondary btn-sm btn-icon" onclick='abrirEditar(${JSON.stringify(item).replace(/"/g,"&quot;")})' title="Editar"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="eliminar(${item.id})" title="Eliminar"><i class="bi bi-trash3"></i></button>
      </div>
    </div>`;
  }).join('');
}

function abrirNueva() {
  editId = null;
  document.getElementById('modal-title').textContent = 'Nueva tarea';
  document.getElementById('af-titulo').value = '';
  document.getElementById('af-desc').value = '';
  document.getElementById('af-fecha').value = hoy;
  document.getElementById('af-hora').value = '';
  document.getElementById('af-tipo').value = 'tarea';
  document.getElementById('af-prioridad').value = 'media';
  openModal('modal-agenda');
}

function abrirEditar(item) {
  editId = item.id;
  document.getElementById('modal-title').textContent = 'Editar';
  document.getElementById('af-titulo').value = item.titulo;
  document.getElementById('af-desc').value = item.descripcion || '';
  document.getElementById('af-fecha').value = item.fecha;
  document.getElementById('af-hora').value = item.hora || '';
  document.getElementById('af-tipo').value = item.tipo;
  document.getElementById('af-prioridad').value = item.prioridad;
  openModal('modal-agenda');
}

async function guardar() {
  const titulo = document.getElementById('af-titulo').value.trim();
  if (!titulo) { toast('Escribe un título', 'error'); return; }
  const body = {
    tipo:        document.getElementById('af-tipo').value,
    titulo,
    descripcion: document.getElementById('af-desc').value,
    fecha:       document.getElementById('af-fecha').value,
    hora:        document.getElementById('af-hora').value,
    prioridad:   document.getElementById('af-prioridad').value,
  };
  try {
    const url = editId ? `/api/agenda/${editId}` : '/api/agenda';
    await api(editId ? 'PUT' : 'POST', url, body);
    closeModal('modal-agenda');
    load();
    toast('Guardado');
  } catch(e) { toast(e.message, 'error'); }
}

async function completar(id) {
  try {
    await api('POST', `/api/agenda/${id}/completar`);
    load();
  } catch(e) { toast(e.message, 'error'); }
}

async function eliminar(id) {
  if (!confirm('¿Eliminar?')) return;
  try {
    await api('DELETE', `/api/agenda/${id}`);
    load();
    toast('Eliminado');
  } catch(e) { toast(e.message, 'error'); }
}

setFiltro('hoy');
</script>
{% endblock %}
