<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Aurora Bakers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-wrap {
      width: 100%;
      max-width: 380px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo .icon { font-size: 2.5rem; }
    .login-logo .title { font-size: 1.4rem; font-weight: 800; color: #1e293b; margin-top: .4rem; }
    .login-logo .sub { font-size: .82rem; color: #64748b; margin-top: .15rem; }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,.09);
      padding: 2rem;
    }
    .card h2 { font-size: 1.1rem; font-weight: 700; color: #1e293b; margin-bottom: 1.5rem; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: .8rem; font-weight: 600; color: #475569; margin-bottom: .35rem; }
    input {
      width: 100%; padding: .65rem .85rem;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: .9rem; color: #1e293b; outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }

    .error-box {
      background: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px;
      padding: .6rem .85rem; font-size: .82rem; color: #991b1b;
      margin-bottom: 1rem; display: flex; align-items: center; gap: .4rem;
    }

    .btn-login {
      width: 100%; padding: .75rem;
      background: #6366f1; color: #fff;
      border: none; border-radius: 8px;
      font-size: .95rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
      margin-top: .5rem;
    }
    .btn-login:hover { background: #4f46e5; }

    .login-footer {
      text-align: center; margin-top: 1.5rem;
      font-size: .75rem; color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="icon">🍞</div>
      <div class="title">Aurora Bakers</div>
      <div class="sub">Sistema de Ventas & CRM</div>
    </div>

    <div class="card">
      <h2>Iniciar sesión</h2>

      {% if error %}
      <div class="error-box"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>
      {% endif %}

      <form method="POST" action="/login{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tu@correo.cl"
                 value="{{ request.form.get('email', '') }}" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">
          <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
      </form>
    </div>

    <div class="login-footer">Aurora Bakers · panypasta.cl</div>
  </div>
</body>
</html>
