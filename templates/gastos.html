{% extends "base.html" %}
{% block title %}Gastos — Aurora Bakers{% endblock %}
{% block page_title %}Gastos{% endblock %}
{% block content %}

<div style="display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center">
  <div style="display:flex;gap:.5rem;align-items:center">
    <input id="f-desde" type="date" class="input" style="width:145px" />
    <span style="color:var(--muted)">—</span>
    <input id="f-hasta" type="date" class="input" style="width:145px" />
    <button class="btn btn-ghost" onclick="load()"><i class="bi bi-search"></i> Filtrar</button>
  </div>
  <button class="btn btn-primary" onclick="abrirNuevo()"><i class="bi bi-plus-lg"></i> Registrar Gasto</button>
  <div id="total-badge" style="margin-left:auto;font-size:.9rem;font-weight:600;color:var(--text)"></div>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;margin-bottom:1.5rem" id="kpi-cats"></div>

<div class="card">
  <table class="table">
    <thead><tr>
      <th>Fecha</th>
      <th>Descripción</th>
      <th>Categoría</th>
      <th>Monto</th>
      <th>Proveedor</th>
      <th>Acciones</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Modal gasto -->
<div id="modal-gasto" class="modal-overlay">
  <div class="modal" style="max-width:480px">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Registrar Gasto</span>
      <button class="modal-close" onclick="closeModal('modal-gasto')"><i class="bi bi-x-lg"></i></button>
    </div>
    <div style="display:grid;gap:.75rem">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        <div class="form-group"><label class="label">Fecha</label><input id="gf-fecha" type="date" class="input" /></div>
        <div class="form-group">
          <label class="label">Categoría</label>
          <select id="gf-cat" class="input">
            <option>Ingredientes</option><option>Packaging</option><option>Luz</option><option>Gas</option>
            <option>Arriendo</option><option>Internet</option><option>Contabilidad</option>
            <option>Mantención</option><option>Transporte</option><option>Marketing</option>
            <option>Seguro</option><option>General</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label class="label">Descripción</label><input id="gf-desc" class="input" placeholder="Ej: Compra harina blanca" /></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
        <div class="form-group"><label class="label">Monto (CLP)</label><input id="gf-monto" type="number" class="input" placeholder="0" /></div>
        <div class="form-group"><label class="label">Proveedor</label><input id="gf-prov" class="input" placeholder="Opcional" /></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-gasto')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<script>
let editId = null;

(function() {
  const hoy = new Date();
  const y = hoy.getFullYear(), m = String(hoy.getMonth()+1).padStart(2,'0');
  document.getElementById('f-desde').value = `${y}-${m}-01`;
  document.getElementById('f-hasta').value = hoy.toISOString().split('T')[0];
  document.getElementById('gf-fecha').value = hoy.toISOString().split('T')[0];
})();

async function load() {
  const desde = document.getElementById('f-desde').value;
  const hasta = document.getElementById('f-hasta').value;
  const gastos = await api('GET', `/api/gastos?desde=${desde}&hasta=${hasta}`);

  const total = gastos.reduce((s,g) => s + g.monto, 0);
  document.getElementById('total-badge').textContent = `Total: $${total.toLocaleString('es-CL')}`;

  const byCat = {};
  gastos.forEach(g => { byCat[g.categoria] = (byCat[g.categoria] || 0) + g.monto; });
  document.getElementById('kpi-cats').innerHTML = Object.entries(byCat)
    .sort((a,b) => b[1]-a[1])
    .map(([cat,tot]) => `
      <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:var(--r);padding:.75rem 1rem">
        <div style="font-size:.72rem;color:var(--muted);margin-bottom:.25rem">${cat}</div>
        <div style="font-weight:700;font-size:1.1rem">$${tot.toLocaleString('es-CL')}</div>
      </div>`).join('') || '';

  document.getElementById('tbody').innerHTML = gastos.map(g => `<tr>
    <td>${g.fecha}</td>
    <td>${g.descripcion}</td>
    <td><span class="badge badge-blue">${g.categoria}</span></td>
    <td><strong>$${g.monto.toLocaleString('es-CL')}</strong></td>
    <td style="color:var(--muted)">${g.proveedor || '—'}</td>
    <td>
      <button class="btn btn-secondary btn-sm btn-icon" onclick='abrirEditar(${JSON.stringify(g).replace(/"/g,"&quot;")})' title="Editar"><i class="bi bi-pencil"></i></button>
      <button class="btn btn-danger btn-sm btn-icon" onclick="eliminar(${g.id})" title="Eliminar"><i class="bi bi-trash3"></i></button>
    </td>
  </tr>`).join('') || '<tr><td colspan="6"><div class="empty"><i class="bi bi-cash-coin"></i><p>Sin gastos en el período</p></div></td></tr>';
}

function abrirNuevo() {
  editId = null;
  document.getElementById('modal-title').textContent = 'Registrar Gasto';
  document.getElementById('gf-desc').value = '';
  document.getElementById('gf-monto').value = '';
  document.getElementById('gf-prov').value = '';
  document.getElementById('gf-cat').value = 'Ingredientes';
  openModal('modal-gasto');
}

function abrirEditar(g) {
  editId = g.id;
  document.getElementById('modal-title').textContent = 'Editar Gasto';
  document.getElementById('gf-fecha').value = g.fecha;
  document.getElementById('gf-cat').value = g.categoria;
  document.getElementById('gf-desc').value = g.descripcion;
  document.getElementById('gf-monto').value = g.monto;
  document.getElementById('gf-prov').value = g.proveedor || '';
  openModal('modal-gasto');
}

async function guardar() {
  const desc = document.getElementById('gf-desc').value.trim();
  const monto = parseFloat(document.getElementById('gf-monto').value);
  if (!desc || !monto) { toast('Descripción y monto son obligatorios', 'error'); return; }
  const body = {
    fecha:      document.getElementById('gf-fecha').value,
    descripcion: desc,
    categoria:  document.getElementById('gf-cat').value,
    monto,
    proveedor:  document.getElementById('gf-prov').value,
  };
  try {
    const url = editId ? `/api/gastos/${editId}` : '/api/gastos';
    await api(editId ? 'PUT' : 'POST', url, body);
    closeModal('modal-gasto');
    load();
    toast('Gasto guardado');
  } catch(e) { toast(e.message, 'error'); }
}

async function eliminar(id) {
  if (!confirm('¿Eliminar gasto?')) return;
  try {
    await api('DELETE', `/api/gastos/${id}`);
    load();
    toast('Eliminado');
  } catch(e) { toast(e.message, 'error'); }
}

load();
</script>
{% endblock %}
